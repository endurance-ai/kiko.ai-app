# ==============================================================================
# kiko.ai-app CI/CD 파이프라인 (DEV)
# ==============================================================================
# 트리거:
#   - dev 브랜치 push (PR 머지 + 직접 커밋 모두 포함)
#   - workflow_dispatch (수동 실행)
#
# `pull_request: closed` 대신 `push` 를 쓰는 이유: PR 머지도 결국 dev 로의
# push 라 push 하나로 둘 다 잡힌다. 두 트리거를 같이 걸면 머지 한 번에 배포가
# 두 번 돈다.
#
# 흐름:
#   1. lint + test (CI 재검증, fail 시 배포 중단)
#   2. Docker 이미지 빌드 (ARM64 네이티브 러너, Next.js standalone)
#   3. ECR Push (태그: <YYYYMMDDhhmmss>-<short_sha>, latest)
#   4. SSH로 dev-app EC2 접속 → /home/ec2-user/scripts/deploy.app.sh 실행
#
# Reference: kikoai/ai 의 deploy-dev.yml (동일 패턴)
# Repo: portal/dev/app (ECR), 이미 portal-ai-gha IAM user 가 portal/dev/* prefix push 권한 보유
# ==============================================================================

name: 🚀 Deploy to AWS

on:
  push:
    branches:
      - dev
    # 런타임에 영향이 없는 변경만 있을 때는 배포를 건너뛴다.
    # paths-ignore 는 이번 push 의 변경 파일이 *전부* 매칭될 때만 스킵하므로,
    # 코드나 migration 이 하나라도 같이 바뀌면 평소대로 배포된다.
    #
    # `.github/**` 를 통째로 넣지 않는 이유: 워크플로는 실제로 돌려봐야 검증이
    # 된다. paths-ignore 에는 예외(negation)를 못 쓰므로 workflows/ 를 남기려면
    # 나머지 파일을 하나씩 적는 수밖에 없다.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/CODEOWNERS'
      - '.github/auto-assign-config.yaml'

  # 문서만 고친 뒤에도 강제로 재배포하고 싶을 때 쓴다.
  workflow_dispatch:
    inputs:
      environment:
        description: '배포 환경'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

permissions:
  contents: read
  pull-requests: read

# 같은 ref 의 동시 deploy 직렬화 (취소하지 않음)
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: kikoai-dev/app

jobs:
  # ============================================
  # Job 1: 검증 (lint + test)
  # ============================================
  verify:
    name: 검증 (lint + test)
    # fork PR 가드는 필요 없다 — push 는 이미 dev 에 들어온 코드다.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: pnpm 셋업
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Node 셋업
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: 테스트
        run: pnpm run test
        continue-on-error: true  # 테스트 인프라 안정화 전까지 임시 — TODO 제거

  # ============================================
  # Job 2: 빌드 + ECR Push
  # ============================================
  build-and-push:
    name: 빌드 및 ECR Push
    needs: verify
    runs-on: ubuntu-24.04-arm

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 태그 생성
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(TZ='Asia/Seoul' date +'%Y%m%d%H%M%S')
          IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"
          echo "tags=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "생성된 태그: ${IMAGE_TAG} (KST)"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 + ECR Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tags }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          platforms: linux/arm64
          provenance: false
          # 빌드 캐시는 배포의 필수 산출물이 아니다. GHA 캐시 용량/예약 실패가
          # ECR push 성공 후 배포 전체를 막지 않도록 작게 저장하고 fail-open.
          cache-from: type=gha,scope=kikoai-app
          cache-to: type=gha,scope=kikoai-app,mode=min,ignore-error=true

  # ============================================
  # Job 3: dev-app EC2 배포
  # ============================================
  deploy:
    name: dev-app 배포
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 변경된 migration 목록 수집
        id: changed-migrations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            let migrations = []

            const isMigration = (name) => /^database\/migrations\/.+\.sql$/.test(name)
            const pick = (files) => files
              .filter((file) => file.status !== "removed")
              .map((file) => file.filename)
              .filter(isMigration)
              .sort()

            // push 는 이번 푸시에 담긴 커밋 범위(before...after)를 비교한다.
            // PR 머지도 push 로 들어오므로 머지 커밋의 변경분이 그대로 잡힌다.
            // before 가 0으로 채워져 있으면(브랜치 신규 생성) 비교 기준이 없어
            // 건너뛴다 — dev 에서는 나오지 않는 경우다.
            if (context.eventName === "push") {
              const {before, after} = context.payload
              if (before && !/^0+$/.test(before)) {
                const {data} = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${before}...${after}`,
                })
                migrations = pick(data.files ?? [])
              } else {
                core.warning("push 의 before 가 비어 있어 migration 비교를 건너뜁니다")
              }
            }

            fs.writeFileSync("changed-migrations.txt", migrations.join("\n") + (migrations.length ? "\n" : ""))
            core.setOutput("has_migrations", migrations.length > 0 ? "true" : "false")
            core.setOutput("count", String(migrations.length))
            core.info(migrations.length > 0 ? `Changed migrations:\n${migrations.join("\n")}` : "No changed migrations")

      - name: migration bundle 준비
        if: steps.changed-migrations.outputs.has_migrations == 'true'
        run: |
          set -euo pipefail
          rm -rf migration-upload
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ ! -f "$file" ]; then
              echo "::error::Migration file not found: $file"
              exit 1
            fi
            mkdir -p "migration-upload/$(dirname "$file")"
            cp "$file" "migration-upload/$file"
          done < changed-migrations.txt
          find migration-upload -type f -name '*.sql' | sort

      - name: migration bundle 업로드
        if: steps.changed-migrations.outputs.has_migrations == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "migration-upload"
          target: "/tmp/kikoai-app-migrations-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: DB migration 적용
        if: steps.changed-migrations.outputs.has_migrations == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            MIGRATION_ROOT="/tmp/kikoai-app-migrations-${{ github.run_id }}-${{ github.run_attempt }}"
            MIGRATION_DIR="${MIGRATION_ROOT}/migration-upload/database/migrations"
            DB_CONTAINER="${DB_CONTAINER:-db}"

            if [ ! -d "$MIGRATION_DIR" ]; then
              echo "[ERROR] migration directory not found: $MIGRATION_DIR"
              exit 1
            fi

            DB_NAME=$(docker exec "$DB_CONTAINER" sh -lc 'printf "%s" "${POSTGRES_DB:-postgres}"')
            DB_USER=$(docker exec "$DB_CONTAINER" sh -lc 'printf "%s" "${POSTGRES_USER:-postgres}"')

            echo "=========================================="
            echo "[kiko.ai-app DEV] DB migration 적용"
            echo "Container: ${DB_CONTAINER}"
            echo "Database: ${DB_NAME}"
            echo "Files: ${{ steps.changed-migrations.outputs.count }}"
            echo "=========================================="

            find "$MIGRATION_DIR" -type f -name '*.sql' | sort | while IFS= read -r file; do
              echo ">>> Applying $(basename "$file")"
              docker exec -i "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" < "$file"
            done

            echo ">>> Reloading PostgREST schema cache"
            docker exec "$DB_CONTAINER" psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" \
              -c "NOTIFY pgrst, 'reload schema';"

            rm -rf "$MIGRATION_ROOT"

      - name: SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================="
            echo "[kiko.ai-app DEV] 배포 시작"
            echo "=========================================="
            /home/ec2-user/scripts/deploy.app.sh ${{ needs.build-and-push.outputs.image_tag }}
