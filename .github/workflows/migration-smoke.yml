name: Migration smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - 'database/migrations/**'
      - 'database/tests/migration-smoke.sh'
      - '.github/workflows/migration-smoke.yml'

permissions:
  contents: read

jobs:
  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migration_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d migration_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: migration_smoke
    steps:
      - uses: actions/checkout@v4
      - name: Verify changed migration contracts in PostgreSQL
        run: bash database/tests/migration-smoke.sh
